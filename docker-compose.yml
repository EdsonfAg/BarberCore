services:
  # -------------------------------------------------------------------
  # SERVICIO 1: Backend Java y Servidor Web (BarberCore)
  # -------------------------------------------------------------------
  barbercore-app:
    build: .
    container_name: barbercore_app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=barbercore-db
      - DB_PORT=3306
      - DB_NAME=barbercore_db
      - DB_USER=barber_user
      - DB_PASSWORD=barber_pass
    networks:
      - barbercore-net
    # Cuando el equipo de BD active el contenedor barbercore-db abajo,
    # solo deben descomentar las siguientes 2 líneas:
    # depends_on:
    #   - barbercore-db

  # -------------------------------------------------------------------
  # SERVICIO 2: Base de Datos Relacional (CAPA 4 - PERSISTENCIA)
  # Descomentar este bloque cuando el equipo de BD esté listo para probar
  # -------------------------------------------------------------------
  # barbercore-db:
  #   image: mysql:8.4
  #   container_name: barbercore_db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root_password
  #     MYSQL_DATABASE: barbercore_db
  #     MYSQL_USER: barber_user
  #     MYSQL_PASSWORD: barber_pass
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #     - barbercore_db_data:/var/lib/mysql
  #   networks:
  #     - barbercore-net

networks:
  barbercore-net:
    driver: bridge

# Descomentar también esta línea al activar barbercore-db:
# volumes:
#   barbercore_db_data:
