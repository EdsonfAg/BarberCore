<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BarberCore | Iniciar Sesión</title>
    <meta name="description" content="Inicia sesión en BarberCore para gestionar tus citas.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
</head>
<body>
    <header id="encabezado"></header>

    <main class="acceso">
        <h1>Inicia Sesión</h1>

        <!-- Más adelante enviará: email, password y recordarme -->
        <form class="formulario" data-formulario="login" novalidate>
            <label for="login-email">Correo Electrónico</label>
            <input type="email" id="login-email" name="email" placeholder="i.e. john@mail.com" autocomplete="email" required>

            <div class="etiqueta-fila">
                <label for="login-password">Contraseña</label>
                <a class="enlace-acento" href="restablecer.html">¿Olvidaste la Contraseña?</a>
            </div>
            <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required>

            <label class="casilla">
                <input type="checkbox" name="recordarme">
                <span>Recuérdame</span>
            </label>

            <p class="error" role="alert"></p>
            <button type="submit" class="boton">Iniciar Sesión</button>
        </form>

        <p class="acceso-pie">¿No tienes una cuenta? <a href="registro.html">Crea una cuenta</a></p>
    </main>

    <footer id="pie"></footer>
    <div class="aviso" id="aviso" role="status"></div>

    <script src="../js/layout.js"></script>
    <script src="../js/componentes.js"></script>
    <script src="../js/acceso.js"></script>
</body>
</html>
