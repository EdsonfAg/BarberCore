<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BarberCore | Nuestros Barberos</title>
    <meta name="description" content="Conoce a los barberos de BarberCore y agenda con tu especialista de confianza.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
</head>
<body>
    <header id="encabezado"></header>

    <main>
        <section class="banner">
            <div class="contenedor">
                <h1>Conoce a Nuestros Barberos</h1>
                <p>Selecciona a tu especialista de confianza y elige tu horario.</p>
            </div>
        </section>

        <section class="seccion" aria-labelledby="titulo-especialistas">
            <div class="contenedor">
                <h2 class="titulo-seccion" id="titulo-especialistas">Nuestros Especialistas</h2>
                <div class="rejilla" id="lista-barberos"></div>
                <p class="nota">No nos hacemos cargo de algún inconveniente con alguno de nuestros especialistas.</p>
            </div>
        </section>
    </main>

    <footer id="pie"></footer>
    <div class="aviso" id="aviso" role="status"></div>

    <script src="../js/datos.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/componentes.js"></script>
    <script>
        window.Datos.obtenerBarberos().then((barberos) => {
            document.getElementById("lista-barberos").innerHTML =
                barberos.map((b) => window.Componentes.tarjetaBarbero(b, true)).join("");
        });
    </script>
</body>
</html>
